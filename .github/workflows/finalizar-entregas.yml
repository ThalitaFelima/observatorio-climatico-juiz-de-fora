name: Finalizar relatórios e validar painel
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/finalizar-entregas.yml"
      - "docs/final/RELATORIO_FINAL.md"
      - "entrega-final/docs/final/RELATORIO_FINAL.md"
      - "docs/devolutiva/RELATO_REAL.md"
      - "docs/escopo-1/AE1-2/RELATORIO_FINAL.md"
      - "docs/escopo-1/AE2-2/PLANEJAMENTO.md"
      - "README.md"
      - "src/exportar_documentos.py"
      - "entrega-final/docs/escopo-1/AE1-2/RELATORIO_FINAL.md"
      - "entrega-final/docs/escopo-1/AE2-2/PLANEJAMENTO.md"
      - "src/app.py"
      - "tests/test_painel.py"

permissions:
  contents: write

jobs:
  finalizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter projeto
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências do projeto e da documentação
        run: |
          python -m pip install -r requirements.txt
          python -m pip install markdown weasyprint python-docx cairosvg playwright pypdf
      - name: Verificar integridade dos registros e testes
        run: |
          python -m unittest discover -s tests -v
          python src/banco.py
          python src/banco.py
      - name: Teste técnico do painel Streamlit
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app=AppTest.from_file("src/app.py").run(timeout=60)
          if len(app.exception):
              raise RuntimeError("Exceções no painel: "+str([x.message for x in app.exception]))
          if len(app.metric)!=3:
              raise AssertionError(f"Esperados 3 KPIs, obtidos {len(app.metric)}")
          print("Dashboard passou: sem exceções e com 3 indicadores.")
          PY
      - name: Exportar documentação final
        run: python src/exportar_documentos.py
      - name: Conferir limite de páginas da AE1
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          for caminho in [
              "docs/escopo-1/AE1-2/RELATORIO_FINAL.pdf",
              "entrega-final/docs/escopo-1/AE1-2/RELATORIO_FINAL.pdf"
          ]:
              paginas = len(PdfReader(caminho).pages)
              print(f"{caminho}: {paginas} páginas")
              if not 2 <= paginas <= 4:
                  raise AssertionError(f"Relatório AE1 fora do limite de 2 a 4 páginas: {paginas}")
          PY
      - name: Preparar navegador para captura de evidências
        run: python -m playwright install chromium
      - name: Capturar painel em execução real
        run: |
          mkdir -p docs/evidencias
          nohup streamlit run src/app.py --server.headless true --server.port 8501 --server.address 127.0.0.1 > /tmp/streamlit.log 2>&1 &
          python - <<'PY'
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--no-sandbox"])
              page=browser.new_page(viewport={"width":1350,"height":2100}, device_scale_factor=1)
              page.goto("http://127.0.0.1:8501",wait_until="domcontentloaded",timeout=60000)
              page.locator('[data-testid="stMetric"]').first.wait_for(timeout=60000)
              page.wait_for_timeout(5000)
              n=page.locator('[data-testid="stMetric"]').count()
              if n!=3:
                  raise AssertionError(f"Esperados 3 cartões métricos; encontrados {n}")
              page.screenshot(path="docs/evidencias/dashboard_streamlit.png",full_page=True)
              Path("docs/evidencias/VALIDACAO.md").write_text(
                  "# Validação do dashboard\n\n"
                  "O GitHub Actions carregou o painel Streamlit, encontrou três cartões métricos "
                  "e registrou captura visual real em dashboard_streamlit.png. "
                  "Os dois gráficos e a tabela estão previstos no código src/app.py. "
                  "Este teste não substitui avaliação de usabilidade junto aos moradores.\n",
                  encoding="utf-8")
              print("Dashboard renderizado: 3 métricas e captura salva.")
              browser.close()
          PY
      - name: Publicar relatórios e evidências no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/escopo-1/AE2-2/PLANEJAMENTO.pdf docs/escopo-1/AE2-2/PLANEJAMENTO.docx
          git add entrega-final/docs/escopo-1/AE2-2/PLANEJAMENTO.pdf entrega-final/docs/escopo-1/AE2-2/PLANEJAMENTO.docx
          git add docs/escopo-1/AE1-2/RELATORIO_FINAL.pdf docs/escopo-1/AE1-2/RELATORIO_FINAL.docx
          git add entrega-final/docs/escopo-1/AE1-2/RELATORIO_FINAL.pdf entrega-final/docs/escopo-1/AE1-2/RELATORIO_FINAL.docx
          git add docs/final/RELATORIO_FINAL.pdf docs/final/RELATORIO_FINAL.docx
          git add entrega-final/docs/final/RELATORIO_FINAL.pdf entrega-final/docs/final/RELATORIO_FINAL.docx
          git add docs/evidencias/
          if ! git diff --cached --quiet; then
            git commit -m "docs: publicar relatórios finais e evidência visual do Streamlit"
            git pull --rebase origin main
            git push
          fi
